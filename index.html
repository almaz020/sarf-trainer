<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Тренажёр спряжения глаголов</title>
    <script>
      (function () {
        try {
          var raw = window.localStorage.getItem('sarf-trainer:v1');
          var data = raw ? JSON.parse(raw) : null;
          var theme = data && typeof data === 'object' ? data.theme : null;
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
